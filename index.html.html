<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Luise">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">

<title>Luises Identität</title>
<style>
:root{
  --bg:#f4f2ee; --card:#ffffff; --ink:#1c1b19; --mute:#7a766f; --line:#e6e2db;
  --accent:#2f7d6d; --accent-ink:#ffffff; --accent-bg:#e1f0ec;
  --bad:#c8372d; --bad-bg:#fbe4e1; --warn:#a8530a; --warn-bg:#fdefd9;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121214; --card:#1c1c20; --ink:#f2f0ec; --mute:#9a968f; --line:#2c2c31;
    --accent:#58b9a6; --accent-ink:#0c1a17; --accent-bg:#17302b;
    --bad:#e5564b; --bad-bg:#3b1b18; --warn:#f0b36a; --warn-bg:#3a2a12; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(16px + env(safe-area-inset-top)) 16px 28px;max-width:640px;width:100%;margin:0 auto}
.tabbar{display:flex;border-top:1px solid var(--line);background:var(--card);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer}
.tab.on{color:var(--accent);font-weight:600}
.ico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
h1{font-size:26px;margin:0;letter-spacing:-.01em;line-height:1.2}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:0;font-weight:600}
p{margin:0}
.mute{color:var(--mute)}
.page-head,.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-head{margin-top:6px}
.pill{border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;font-size:14px;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.pill.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;padding:13px 18px;border-radius:14px;text-decoration:none;cursor:pointer;flex:1;text-align:center}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sos{background:var(--bad);color:#fff}
.btn.wide{width:100%;flex:none}
.btn[disabled]{opacity:.5}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--accent);font:inherit;font-size:15px;cursor:pointer;padding:8px}
.avatar{border-radius:50%;background:linear-gradient(135deg,var(--accent),#7cc4b3);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.hero{display:flex;gap:14px;align-items:center}
.hero p{color:var(--mute);margin-top:2px}
.kv{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--mute);flex:0 0 auto;max-width:45%}
.kv .v{text-align:right;white-space:pre-wrap;word-break:break-word}
.lnk{color:var(--accent);text-decoration:none;font-weight:600}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.li-txt small,.alert small{color:var(--mute);font-size:13px}
.li.dim{opacity:.55}
.chev{color:var(--mute);font-size:22px;line-height:1}
.callbtn{flex:none;width:40px;height:40px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center}
.callbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-block;align-self:flex-start;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--line);color:var(--mute);margin-top:4px}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.ok{background:var(--accent-bg);color:var(--accent)}
.alert{display:flex;gap:10px;padding:12px 14px;border-radius:14px;align-items:flex-start;border:0;width:100%;text-align:left;font:inherit;color:var(--ink);cursor:pointer;background:var(--accent-bg)}
.alert.bad{background:var(--bad-bg)}
.alert.warn{background:var(--warn-bg)}
.alert .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--accent)}
.alert.bad .dot{background:var(--bad)}
.alert.warn .dot{background:var(--warn)}
.alert small{display:block}
.hint{background:var(--accent-bg);border-color:transparent;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.empty{color:var(--mute);font-size:15px;padding:6px 0}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.fchip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.doc{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:var(--line)}
.thumb.pdf{display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--mute)}
.doc-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.doc-txt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-txt .sub{color:var(--mute);font-size:13px}
.doc-txt .note{font-size:13px;color:var(--mute);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{flex:none;min-width:44px;height:44px;padding:0 6px;border-radius:12px;display:grid;place-items:center;font-weight:700;background:var(--line);color:var(--mute);font-size:14px}
.badge.done{background:var(--accent);color:var(--accent-ink)}
.doc-imgwrap{overflow:auto;border-radius:14px;border:1px solid var(--line);background:var(--card);max-height:65vh;max-height:65dvh}
.doc-img{display:block;width:100%;height:auto}
.doc-img.zoomed{width:220%;max-width:none}
.doc-pdf{width:100%;height:65vh;height:65dvh;border:1px solid var(--line);border-radius:14px;background:#fff}
.back{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:50;opacity:0;transition:opacity .2s}
.back.in{opacity:1}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;transform:translateY(20px);transition:transform .22s;margin:0}
.back.in .sheet{transform:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.sheet-head b{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-btn{border:0;background:none;color:var(--accent);font:inherit;font-size:16px;cursor:pointer;padding:4px;min-width:70px}
.nav-btn:first-child{text-align:left}
.nav-btn.strong{font-weight:700;text-align:right}
.nav-spacer{min-width:70px}
.sheet-body{overflow-y:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.back.full{opacity:1;align-items:stretch;background:var(--bg)}
.back.full .sheet{max-height:none;height:100%;border-radius:0;transform:none;max-width:none}
.back.full .sheet-head{padding-top:calc(14px + env(safe-area-inset-top))}
.back.full .sheet-body{width:100%;max-width:640px;margin:0 auto}
.back.sos .sheet-head{background:var(--bad);color:#fff;border-bottom:0}
.back.sos .nav-btn{color:#fff}
.field{display:flex;flex-direction:column;gap:6px}
.field .lbl{font-size:13px;color:var(--mute);font-weight:600}
.field small{color:var(--mute);font-size:12px}
.field.check{flex-direction:row;align-items:center;gap:10px}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-height:46px}
input[type=text],input[type=tel],input[type=date],input[type=search],textarea{-webkit-appearance:none;appearance:none}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0}
input[type=file]{padding:10px}
textarea{resize:vertical}
.em{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.em small{color:var(--mute);font-size:13px;display:block}
.em div{font-size:19px;font-weight:600;white-space:pre-wrap;word-break:break-word}
.call{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-radius:14px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600}
.call small{opacity:.85;font-weight:400}
#lock,#privacy{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom);overflow-y:auto}
#privacy{z-index:999}
#lock[hidden],#privacy[hidden]{display:none}
.lock-in{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:16px 0}
.lock-in .ico svg{width:34px;height:34px;color:var(--accent)}
.lock-in p{color:var(--mute);min-height:22px;font-size:15px}
.lock-in p.err{color:var(--bad)}
.dots{display:flex;gap:14px;margin:10px 0 8px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mute);display:block}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.padgrid{display:grid;grid-template-columns:repeat(3,76px);gap:14px;margin-top:6px}
.key{width:76px;height:76px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:28px;box-shadow:var(--shadow);cursor:pointer;padding:0}
.key:active{background:var(--line)}
.key.ghost{background:none;border:0;box-shadow:none;font-size:22px;color:var(--mute)}
#lock.busy .padgrid{opacity:.4;pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:2000;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav id="tabbar" class="tabbar"></nav>
</div>
<div id="lock" hidden>
  <div class="lock-in">
    <span class="ico"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
    <h1 id="lockTitle"></h1>
    <p id="lockSub"></p>
    <div class="dots" id="lockDots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="padgrid" id="lockPad"></div>
    <div id="lockExtra"></div>
  </div>
</div>
<div id="privacy" hidden><div class="lock-in"><span class="ico"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span><h1>Luises Identität</h1></div></div>
<div id="toast"></div>

<script>
(() => {
'use strict';

/* ============ Helfer ============ */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'value') el.value = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  const add = k => {
    if (k == null || k === false) return;
    if (Array.isArray(k)) k.forEach(add);
    else el.append(k.nodeType ? k : document.createTextNode(String(k)));
  };
  kids.forEach(add);
  return el;
}
const ls = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
  del: k => { try { localStorage.removeItem(k); } catch (e) {} }
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad2 = n => String(n).padStart(2, '0');
const today0 = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const parseD = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtD = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}.${m}.${y}`; };
const isoToday = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const daysTo = iso => Math.round((parseD(iso) - today0()) / 864e5);
const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;
function rel(iso) {
  const d = daysTo(iso);
  if (d === 0) return 'heute';
  if (d === 1) return 'morgen';
  if (d === -1) return 'gestern';
  return d > 0 ? `in ${d} Tagen` : `vor ${-d} Tagen`;
}
function ageText(iso) {
  if (!iso) return '';
  const b = parseD(iso), n = new Date();
  let y = n.getFullYear() - b.getFullYear(), m = n.getMonth() - b.getMonth();
  if (n.getDate() < b.getDate()) m--;
  if (m < 0) { y--; m += 12; }
  if (y < 0) return '';
  if (y === 0) return plural(m, 'Monat', 'Monate');
  if (y < 4) return plural(y, 'Jahr', 'Jahre') + (m ? ', ' + plural(m, 'Monat', 'Monate') : '');
  return plural(y, 'Jahr', 'Jahre');
}
const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
const telHref = n => 'tel:' + String(n).replace(/[^\d+]/g, '');
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2000);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); }
  catch (e) {
    const ta = h('textarea', { value: t, style: 'position:fixed;opacity:0;top:0' });
    document.body.append(ta); ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    ta.remove();
  }
  toast('Kopiert');
}
const ICON = {
  home: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="11" r="2"/><path d="M5.8 16c.7-1.8 4.7-1.8 6.4 0M14.5 10h3.5M14.5 13.5H17"/></svg>',
  docs: '<svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>',
  health: '<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
  school: '<svg viewBox="0 0 24 24"><path d="M3 9l9-5 9 5-9 5z"/><path d="M7 11.5V16c0 1.2 2.2 2.5 5 2.5s5-1.3 5-2.5v-4.5"/></svg>',
  more: '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>',
  phone: '<svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>'
};

/* ============ Datenbank (IndexedDB) ============ */
let db;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('luise-identitaet', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
      if (!d.objectStoreNames.contains('docs')) d.createObjectStore('docs', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('files')) d.createObjectStore('files', { keyPath: 'id' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn) {
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const s = t.objectStore(store);
    let out;
    const rq = fn(s);
    if (rq) rq.onsuccess = () => { out = rq.result; };
    t.oncomplete = () => res(out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  });
}
const kvGet = k => tx('kv', 'readonly', s => s.get(k));
const kvSet = (k, v) => tx('kv', 'readwrite', s => s.put(v, k));
const docsAll = () => tx('docs', 'readonly', s => s.getAll());
const docPut = d => tx('docs', 'readwrite', s => s.put(d));
const docDel = id => tx('docs', 'readwrite', s => s.delete(id));
const fileGet = id => tx('files', 'readonly', s => s.get(id));
const filePut = f => tx('files', 'readwrite', s => s.put(f));
const fileDel = id => tx('files', 'readwrite', s => s.delete(id));
const clearStores = () => Promise.all(['kv', 'docs', 'files'].map(n => tx(n, 'readwrite', s => s.clear())));

/* ============ Zustand ============ */
let S = null;
async function loadState() {
  const [profile, health, school, docs] = await Promise.all([kvGet('profile'), kvGet('health'), kvGet('school'), docsAll()]);
  S = {
    profile: Object.assign({ kontakte: [], extras: [] }, profile || {}),
    health: Object.assign({ impfungen: [], u: {} }, health || {}),
    school: Object.assign({ abholer: [], termine: [] }, school || {}),
    docs: docs || []
  };
}
const persist = k => kvSet(k, S[k]);

/* ============ Sperre ============ */
const LOCK_KEY = 'luise_lock_v1';
const enc = new TextEncoder();
const hasSubtle = () => !!(window.crypto && window.crypto.subtle);
const toHex = buf => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
function cyrb(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
}
async function hashPin(pin, saltHex, scheme) {
  if (scheme === 'pbkdf2') {

async function imageToJpeg(file, max, q) {

    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Bild nicht lesbar')); i.src = url; });

    const sc = Math.min(1, max / Math.max(w, hh));
    const cw = Math.max(1, Math.round(w * sc)), ch = Math.max(1, Math.round(hh * sc));
    const c = document.createElement('canvas'); c.width = cw; c.height = ch;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cw, ch); ctx.drawImage(img, 0, 0, cw, ch);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
    if (!blob) throw new Error('Bild nicht verarbeitbar');
    return blob;
  } finally { URL.revokeObjectURL(url); }
}

async function prepareFile(file) {
  if (file.type && file.type.startsWith('image/')) {
    try {
      const big = await imageToJpeg(file, 2200, 0.86);
      const th = await imageToJpeg(file, 180, 0.7);
      return { mime: 'image/jpeg', data: await big.arrayBuffer(), thumb: await blobToDataURL(th) };
    } catch (e) { /* Rohdatei speichern */ }
  }
  const mime = file.type || (/\.pdf$/i.test(file.name) ? 'application/pdf' : 'application/octet-stream');
  return { mime, data: await file.arrayBuffer(), thumb: null };
}

  if (n <= 90) return h('span', { class: 'chip warn' }, 'Gültig bis ' + fmtD(d.ablauf));
  return h('span', { class: 'chip ok' }, 'Gültig bis ' + fmtD(d.ablauf));
}
function viewDocs() {

function editDoc(d) {
  const isNew = !d;
  const fields = [
    ...(isNew ? [{ key: 'datei', label: 'Datei (Foto, Scan oder PDF)', type: 'file', accept: 'image/*,application/pdf', required: true, fillTitle: 'titel' }] : []),
    { key: 'titel', label: 'Bezeichnung', required: true, ph: 'z. B. Geburtsurkunde' },

    title: isNew ? 'Dokument hinzufügen' : 'Dokument bearbeiten', fields,

        const rec = await prepareFile(file);

    onDelete: isNew ? null : async () => {

}
async function openDoc(d) {
  const rec = await fileGet(d.id);
  if (!rec) { toast('Datei nicht gefunden'); return; }
  const blob = new Blob([rec.data], { type: rec.mime });
  const url = mkUrl(blob);
  const ext = rec.mime === 'application/pdf' ? '.pdf' : rec.mime === 'image/jpeg' ? '.jpg' : '';
  const fname = (d.titel.replace(/[\\/:*?"<>|]+/g, '_') || 'Dokument') + ext;
  const file = new File([blob], fname, { type: rec.mime });
  const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
  let preview;
  if (rec.mime.startsWith('image/')) {
    const img = h('img', { class: 'doc-img', src: url, alt: d.titel, onclick: () => img.classList.toggle('zoomed') });
    preview = h('div', { class: 'doc-imgwrap' }, img);
  } else if (rec.mime === 'application/pdf') preview = h('iframe', { class: 'doc-pdf', src: url, title: d.titel });
  else preview = h('div', { class: 'card' }, 'Keine Vorschau verfügbar.');
  const body = h('div', { class: 'stack' }, preview,
    h('div', { class: 'card' }, kv('Kategorie', d.kategorie), kv('Gültig bis', d.ablauf ? fmtD(d.ablauf) : ''), kv('Notiz', d.notiz), kv('Größe', fmtSize(rec.data.byteLength))),
    h('div', { class: 'btn-row' },
      canShare ? h('button', { class: 'btn', onclick: () => navigator.share({ files: [file], title: d.titel }).catch(() => {}) }, 'Teilen / Sichern') : h('a', { class: 'btn', href: url, download: fname }, 'Herunterladen'),
      rec.mime === 'application/pdf' ? h('a', { class: 'btn ghost', href: url, target: '_blank' }, 'Neuer Tab') : null),
    h('button', { class: 'btn ghost wide', onclick: () => editDoc(d) }, 'Bearbeiten / Löschen'));
  viewer = openFull({ title: d.titel, body, onClose: () => { rmUrl(url); viewer = null; } });
}

/* ============ Ansicht: Mehr ============ */
let backupFile = null;
const ab2b64 = buf => { const b = new Uint8Array(buf); let s = ''; const C = 0x8000; for (let i = 0; i < b.length; i += C) s += String.fromCharCode.apply(null, b.subarray(i, i + C)); return btoa(s); };
const b642ab = b64 => { const s = atob(b64); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; };
async function buildBackup() {
  const docs = [];
  for (const d of S.docs) { const rec = await fileGet(d.id); docs.push({ meta: d, mime: rec ? rec.mime : d.mime, b64: rec ? ab2b64(rec.data) : null }); }
  const json = JSON.stringify({ app: 'luise-identitaet', version: 1, exportedAt: new Date().toISOString(), profile: S.profile, health: S.health, school: S.school, docs });
  return new File([json], `Luise-Sicherung-${isoToday()}.json`, { type: 'application/json' });
}
async function importBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { throw new Error('Datei ist keine gültige Sicherung'); }
  if (!data || data.app !== 'luise-identitaet' || !Array.isArray(data.docs)) throw new Error('Datei ist keine gültige Sicherung');
  if (!confirm('Alle aktuellen Daten werden durch die Sicherung ersetzt. Fortfahren?')) return;
  await clearStores();
  await kvSet('profile', data.profile || {}); await kvSet('health', data.health || {}); await kvSet('school', data.school || {});
  for (const d of data.docs) {
    if (!d.meta || !d.meta.id) continue;
    if (d.b64) await filePut({ id: d.meta.id, mime: d.mime, data: b642ab(d.b64) });
    await docPut(d.meta);
  }
  await loadState(); render(); toast('Sicherung eingespielt');
}
async function changeLock() {
  if (!(await verifyPin('Aktueller Code'))) return;
  const ok = await createPin('Abbrechen');
  if (ok) { ls.del('luise_nolock'); toast('Code gespeichert'); }
  render();
}
async function removeLock() {
  if (!(await verifyPin('Code zum Entfernen'))) return;
  lockScreen.hide(); ls.del(LOCK_KEY); ls.set('luise_nolock', '1'); toast('Code entfernt'); render();
}
function viewMore() {
  const wrap = h('div', { class: 'stack' });
  wrap.append(pageHead('Mehr'));
  const lock = getLock();
  wrap.append(sectionHead('Sperre'));
  wrap.append(h('div', { class: 'card stack' },
    h('p', { class: 'mute' }, lock ? 'Die App ist mit einem Code geschützt.' : 'Die App ist nicht gesperrt. Mit einem Code sind Luises Daten auch bei fremdem Zugriff auf dein iPhone geschützt.'),
    lock ? h('div', { class: 'btn-row' }, h('button', { class: 'btn', onclick: lockNow }, 'Jetzt sperren'), h('button', { class: 'btn ghost', onclick: changeLock }, 'Code ändern')) : h('button', { class: 'btn wide', onclick: changeLock }, 'Code festlegen'),
    lock ? h('label', { class: 'field' }, h('span', { class: 'lbl' }, 'Automatisch sperren'),
      h('select', { onchange: e => { ls.set('luise_autolock', e.target.value); toast('Gespeichert'); } },
        [['0', 'Sofort beim Verlassen'], ['30', 'Nach 30 Sekunden'], ['300', 'Nach 5 Minuten']].map(([v, l]) => h('option', { value: v, selected: String(autolockSec()) === v }, l)))) : null,
    lock ? h('button', { class: 'linkbtn', onclick: removeLock }, 'Code entfernen') : null));
  wrap.append(sectionHead('Datensicherung'));
  const lb = parseInt(ls.get('luise_lastbackup'), 10);
  const file = h('input', { type: 'file', accept: '.json,application/json', style: 'display:none', onchange: async e => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    try { await importBackup(f); } catch (err) { toast(err.message || 'Fehler beim Einspielen'); }
  } });
  wrap.append(h('div', { class: 'card stack' },
    h('p', { class: 'mute' }, 'Alle Daten liegen nur auf diesem Gerät. Erstelle regelmäßig eine Sicherung und lege sie z. B. in iCloud Drive ab.' + (lb ? ' Letzte Sicherung: ' + new Date(lb).toLocaleDateString('de-DE') + '.' : '')),
    backupFile
      ? h('button', { class: 'btn wide', onclick: async () => {
          const f = backupFile;
          try {
            if (navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f], title: 'Sicherung Luises Identität' });
            else { const u = mkUrl(f); const a = h('a', { href: u, download: f.name }); document.body.append(a); a.click(); a.remove(); setTimeout(() => rmUrl(u), 10000); }
            ls.set('luise_lastbackup', String(Date.now())); backupFile = null; render();
          } catch (e) { if (e && e.name !== 'AbortError') toast('Sichern nicht möglich'); }
        } }, `Sicherung sichern (${fmtSize(f_size())})`)
      : h('button', { class: 'btn wide', onclick: async e => {
          const b = e.currentTarget; b.disabled = true; b.textContent = 'Wird erstellt …';
          try { backupFile = await buildBackup(); } catch (err) { toast('Fehler: ' + (err.message || err)); }
          render();
        } }, 'Sicherung erstellen'),
    h('button', { class: 'btn ghost wide', onclick: () => { suppressLockUntil = Date.now() + 180000; file.click(); } }, 'Sicherung einspielen'), file));
  wrap.append(sectionHead('Datenschutz'));
  wrap.append(h('div', { class: 'card' }, h('p', { class: 'mute' }, 'Es gibt keinen Server und kein Konto. Alle Angaben und Dokumente bleiben im Speicher dieser App auf deinem iPhone. Der Code ist ein Zugriffsschutz, die Dateien selbst werden zusätzlich durch die Geräteverschlüsselung deines iPhones geschützt (aktiv, solange du einen Gerätecode gesetzt hast).')));
  wrap.append(sectionHead('Gefahrenzone'));
  wrap.append(h('button', { class: 'btn danger wide', onclick: async () => {
    if (!confirm('Wirklich ALLE Daten in dieser App löschen? Das kann nicht rückgängig gemacht werden.')) return;
    if (!confirm('Letzte Rückfrage: Alles unwiderruflich löschen?')) return;
    await wipeAll();
  } }, 'Alle Daten löschen'));
  return wrap;
}
const f_size = () => backupFile ? backupFile.size : 0;

/* ============ Navigation & Start ============ */
const TABS = [
  { id: 'home', label: 'Übersicht', icon: ICON.home },
  { id: 'docs', label: 'Dokumente', icon: ICON.docs },

const views = { home: viewHome, docs: viewDocs, health: viewHealth, school: viewSchool, more: viewMore };
let tab = 'home', lastTab = null;
function go(id) { tab = id; render(); }
function render() {
  if (!S) return;
  const v = $('#view');
  const keep = lastTab === tab ? v.scrollTop : 0;
  lastTab = tab;
  try { v.replaceChildren(views[tab]()); }
  catch (e) { console.error(e); v.replaceChildren(h('p', { class: 'empty' }, 'Anzeigefehler: ' + e.message)); }
  v.scrollTop = keep;
  $('#tabbar').replaceChildren(...TABS.map(t => h('button', { class: 'tab' + (t.id === tab ? ' on' : ''), 'aria-label': t.label, onclick: () => go(t.id) }, h('span', { class: 'ico', html: t.icon }), h('span', null, t.label))));
}
function makeIcon() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 180, 180);
    g.addColorStop(0, '#2f7d6d'); g.addColorStop(1, '#7cc4b3');
    x.fillStyle = g; x.fillRect(0, 0, 180, 180);
    x.fillStyle = '#fff'; x.font = '700 96px -apple-system,Helvetica,Arial,sans-serif';
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('L', 90, 96);
    const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png');
    document.head.append(l);
  } catch (e) {}
}
async function boot() {
  makeIcon();
  try { db = await openDB(); }
  catch (e) { document.body.replaceChildren(h('p', { style: 'padding:24px' }, 'Der Speicher ist nicht verfügbar. Bitte prüfe, ob privates Surfen aus ist, und lade die Seite neu.')); return; }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if (getLock()) await unlockFlow();
  else if (!ls.get('luise_nolock')) { const ok = await createPin('Ohne Code fortfahren'); if (!ok) ls.set('luise_nolock', '1'); }
  await loadState();
  render();
}
boot();
window.__luise = { get state() { return S; }, go, render };
})();
