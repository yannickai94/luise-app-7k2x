name: News aktualisieren

on:
  schedule:
    - cron: 17 */3 * * *
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: News holen
        run: python news_fetch.py
      - name: news.json speichern
        run: |
          git config user.name news-bot
          git config user.email news-bot@users.noreply.github.com
          git add news.json
          git diff --staged --quiet || git commit -m News-aktualisiert
          git push
