<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="app-version" content="30">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyLuiseApp">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>MyLuiseApp</title>
<style>
:root{
  --bg:#f4f2ee; --card:#ffffff; --ink:#1c1b19; --mute:#7a766f; --line:#e6e2db;
  --accent:#2f7d6d; --accent-ink:#ffffff; --accent-bg:#e1f0ec;
  --bad:#c8372d; --bad-bg:#fbe4e1; --warn:#a8530a; --warn-bg:#fdefd9;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121214; --card:#1c1c20; --ink:#f2f0ec; --mute:#9a968f; --line:#2c2c31;
    --accent:#58b9a6; --accent-ink:#0c1a17; --accent-bg:#17302b;
    --bad:#e5564b; --bad-bg:#3b1b18; --warn:#f0b36a; --warn-bg:#3a2a12; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(16px + env(safe-area-inset-top)) 16px 28px;max-width:640px;width:100%;margin:0 auto}
.tabbar{display:flex;border-top:1px solid var(--line);background:var(--card);background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;min-width:0;border:0;background:none;color:var(--mute);font:inherit;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer}
.tab.on{color:var(--accent);font-weight:600}
.newsitem{text-decoration:none;color:inherit;align-items:flex-start}
.newsitem b{font-weight:600;line-height:1.3}
.newsk{display:block;margin:2px 0}
.newsfoot{display:block;font-size:12px;line-height:1.4;padding:0 4px 8px}
.newshero .linkbtn{text-align:left}
.newsitem{align-items:center;gap:12px}
.newsth{flex:none;width:88px;height:66px;border-radius:10px;overflow:hidden;background:var(--accent-bg);display:flex;align-items:center;justify-content:center}
.newsth img{width:100%;height:100%;object-fit:cover;display:block}
.newsph{font-size:28px}
.newsnote{background:var(--warn-bg);color:var(--warn)}
.btn.small{padding:8px 14px;font-size:14px}
.offhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.offhead b{flex:1;font-size:17px}
.offhead .chip{margin-top:0}
.offgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.offkv{display:flex;flex-direction:column}
.offkv small{color:var(--mute);font-size:12px}
.offkv b{font-size:15px}
.quizopt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;font:inherit;font-size:16px;cursor:pointer}
.quizopt .qk{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.quizopt span:nth-child(2){flex:1}
.quizopt .qm{flex:none;font-weight:700}
.quizopt.right{border-color:var(--accent);background:var(--accent-bg)}
.quizopt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.quizopt.dim{opacity:.55}
.quizfb.ok{border-left:4px solid var(--accent)}
.quizfb.bad{border-left:4px solid var(--bad)}
@media(max-width:400px){.tab{font-size:10px}}
.ico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
h1{font-size:26px;margin:0;letter-spacing:-.01em;line-height:1.2}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:0;font-weight:600}
p{margin:0}
.mute{color:var(--mute)}
.page-head,.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-head{margin-top:6px}
.pill{border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;font-size:14px;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.pill.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;padding:13px 18px;border-radius:14px;text-decoration:none;cursor:pointer;flex:1;text-align:center}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sos{background:var(--bad);color:#fff}
.btn.wide{width:100%;flex:none}
.btn[disabled]{opacity:.5}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--accent);font:inherit;font-size:15px;cursor:pointer;padding:8px}
.avatar{border-radius:50%;background:linear-gradient(135deg,var(--accent),#7cc4b3);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.hero{display:flex;gap:14px;align-items:center}
.hero p{color:var(--mute);margin-top:2px}
.kv{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--mute);flex:0 0 auto;max-width:45%}
.kv .v{text-align:right;white-space:pre-wrap;word-break:break-word}
.lnk{color:var(--accent);text-decoration:none;font-weight:600}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.li-txt small,.alert small{color:var(--mute);font-size:13px}
.li.dim{opacity:.55}
.chev{color:var(--mute);font-size:22px;line-height:1}
.callbtn{flex:none;width:40px;height:40px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center}
.callbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-block;align-self:flex-start;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--line);color:var(--mute);margin-top:4px}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.ok{background:var(--accent-bg);color:var(--accent)}
.alert{display:flex;gap:10px;padding:12px 14px;border-radius:14px;align-items:flex-start;border:0;width:100%;text-align:left;font:inherit;color:var(--ink);cursor:pointer;background:var(--accent-bg)}
.alert.bad{background:var(--bad-bg)}
.alert.warn{background:var(--warn-bg)}
.alert .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--accent)}
.alert.bad .dot{background:var(--bad)}
.alert.warn .dot{background:var(--warn)}
.alert small{display:block}
.hint{background:var(--accent-bg);border-color:transparent;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.empty{color:var(--mute);font-size:15px;padding:6px 0}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.fchip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.doc{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:var(--line)}
.thumb.pdf{display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--mute)}
.doc-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.doc-txt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-txt .sub{color:var(--mute);font-size:13px}
.doc-txt .note{font-size:13px;color:var(--mute);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{flex:none;min-width:44px;height:44px;padding:0 6px;border-radius:12px;display:grid;place-items:center;font-weight:700;background:var(--line);color:var(--mute);font-size:14px}
.badge.done{background:var(--accent);color:var(--accent-ink)}
.doc-pdf{width:100%;height:65vh;height:65dvh;border:1px solid var(--line);border-radius:14px;background:#fff}
.back{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:50;opacity:0;transition:opacity .2s}
.back.in{opacity:1}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;transform:translateY(20px);transition:transform .22s;margin:0}
.back.in .sheet{transform:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.sheet-head b{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-btn{border:0;background:none;color:var(--accent);font:inherit;font-size:16px;cursor:pointer;padding:4px;min-width:70px}
.nav-btn:first-child{text-align:left}
.nav-btn.strong{font-weight:700;text-align:right}
.nav-spacer{min-width:70px}
.sheet-body{overflow-y:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.back.full{opacity:1;align-items:stretch;background:var(--bg)}
.back.full .sheet{max-height:none;height:100%;border-radius:0;transform:none;max-width:none}
.back.full .sheet-head{padding-top:calc(14px + env(safe-area-inset-top))}
.back.full .sheet-body{width:100%;max-width:640px;margin:0 auto}
.back.sos .sheet-head{background:var(--bad);color:#fff;border-bottom:0}
.back.sos .nav-btn{color:#fff}
.field{display:flex;flex-direction:column;gap:6px}
.field .lbl{font-size:13px;color:var(--mute);font-weight:600}
.field small{color:var(--mute);font-size:12px}
.field.check{flex-direction:row;align-items:center;gap:10px}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-height:46px}
input[type=text],input[type=tel],input[type=date],input[type=search],textarea{-webkit-appearance:none;appearance:none}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0}
input[type=file]{padding:10px}
textarea{resize:vertical}
.em{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.em small{color:var(--mute);font-size:13px;display:block}
.em div{font-size:19px;font-weight:600;white-space:pre-wrap;word-break:break-word}
.call{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-radius:14px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600}
.call small{opacity:.85;font-weight:400}
#lock,#privacy{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom);overflow-y:auto}
#privacy{z-index:999}
#lock[hidden],#privacy[hidden]{display:none}
.lock-in{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:16px 0}
.lock-in .ico svg{width:34px;height:34px;color:var(--accent)}
.lock-in p{color:var(--mute);min-height:22px;font-size:15px}
.lock-in p.err{color:var(--bad)}
.dots{display:flex;gap:14px;margin:10px 0 8px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mute);display:block}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.padgrid{display:grid;grid-template-columns:repeat(3,76px);gap:14px;margin-top:6px}
.key{width:76px;height:76px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:28px;box-shadow:var(--shadow);cursor:pointer;padding:0}
.key:active{background:var(--line)}
.key.ghost{background:none;border:0;box-shadow:none;font-size:22px;color:var(--mute)}
#lock.busy .padgrid{opacity:.4;pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:2000;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

:root{--g1:#2a7567;--g2:#4aa08e;--g3:#e8a07c}
@media (prefers-color-scheme:dark){:root{--g1:#1d4f45;--g2:#2b7566;--g3:#a8644a}}
h1,.badge,.stat b,.metric b{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif}
.tab .ico{padding:2px 16px;border-radius:999px;transition:background .2s}
.tab.on .ico{background:var(--accent-bg)}
.hero2{position:relative;border-radius:26px;padding:18px;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2) 58%,var(--g3));box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.hero2 .top{display:flex;gap:14px;align-items:center;padding-right:34px}
.hero2 h1{color:#fff;font-size:24px}
.hero2 p{color:rgba(255,255,255,.9);margin-top:2px;font-size:15px}
.hero2 .avatar{border:3px solid rgba(255,255,255,.7);background:rgba(255,255,255,.25);color:#fff}
.hero2 .editbtn{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.22);color:#fff;display:grid;place-items:center;cursor:pointer}
.editbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.2);border-radius:14px;padding:8px 12px;font-size:13px;line-height:1.25;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);max-width:100%}
.stat b{display:block;font-size:18px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;text-align:left;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-bg);color:var(--accent)}
.tile.sos .ico{background:var(--bad-bg);color:var(--bad)}
.tile small{display:block;font-weight:400;color:var(--mute);font-size:12px;line-height:1.3}
button.callbtn{border:0;cursor:pointer;padding:0}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;font:inherit;font-weight:600;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.metric{display:flex;gap:10px;flex-wrap:wrap}
.metric>div{flex:1;min-width:92px;background:var(--bg);border-radius:14px;padding:10px 12px}
.metric small{color:var(--mute);display:block;font-size:12px}
.metric b{font-size:20px}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart text{fill:var(--mute);font-size:10px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .dt{fill:var(--card);stroke:var(--accent);stroke-width:2}
.chart .gd{stroke:var(--line);stroke-width:1}
.doc-prev{display:block;width:100%;max-height:60vh;max-height:60dvh;object-fit:contain;background:var(--card);border:1px solid var(--line);border-radius:14px;cursor:zoom-in}
.prev-hint{text-align:center;color:var(--mute);font-size:13px}
.lb{position:fixed;inset:0;background:#000;z-index:80;display:flex;flex-direction:column}
.lb-stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
.lb-stage img{width:100%;height:100%;object-fit:contain;transform-origin:center;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;will-change:transform}
.lb-close{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.22);color:#fff;font-size:18px;cursor:pointer}
.lb-hint{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:rgba(255,255,255,.7);font-size:13px;pointer-events:none}
.enter{animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.enter,.dots.shake{animation:none}.tile{transition:none}}

.backbtn{align-self:flex-start;border:0;background:none;color:var(--accent);font:inherit;font-size:16px;padding:0;cursor:pointer}
.hubico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-bg);color:var(--accent);flex:none}
.tile.gold .ico{background:#fdf0cc;color:#a56a00}
.tile.violet .ico{background:#ece6fb;color:#6a4fc7}
@media (prefers-color-scheme:dark){.tile.gold .ico{background:#3a2e10;color:#f2c14e}.tile.violet .ico{background:#2a2347;color:#b6a2ff}}
.ph-group{display:flex;flex-direction:column;gap:6px}
.ph-month{font-weight:700;color:var(--mute);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.ph{position:relative;aspect-ratio:1;border:0;padding:0;background:var(--line);border-radius:6px;overflow:hidden;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph-fav{position:absolute;right:6px;bottom:3px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);font-size:14px}
.lb-bar{position:absolute;left:0;right:0;bottom:0;padding:28px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;display:flex;flex-direction:column;gap:10px;z-index:2}
.ph-cap{font-size:15px;line-height:1.3;min-height:20px}
.ph-cap small{display:block;opacity:.75}
.lb-acts{display:flex;gap:8px}
.lb-act{flex:1;border:0;border-radius:12px;background:rgba(255,255,255,.2);color:#fff;font:inherit;font-size:14px;padding:10px 4px;cursor:pointer}
.lb-count{position:absolute;top:calc(22px + env(safe-area-inset-top));left:0;right:0;text-align:center;color:#fff;font-size:14px;pointer-events:none}
.lb-nav{position:absolute;top:45%;width:40px;height:56px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:28px;cursor:pointer;z-index:2}
.lb-nav.l{left:0;border-radius:0 14px 14px 0}.lb-nav.r{right:0;border-radius:14px 0 0 14px}
.hero2.gold{background:linear-gradient(135deg,#8a5a14,#c98a24 60%,#e8b84d)}
.hero2.cosmic{background:linear-gradient(135deg,#2b1f63,#5b3fb0 55%,#b58cf0)}

function chartSvg(pts, fmt) {
  const W = 320, H = 160, pl = fmt ? 54 : 38, pr = 14, pt = 14, pb = 26;
  const ts = pts.map(p => p.t), ys = pts.map(p => p.y);
  const t0 = Math.min(...ts); let t1 = Math.max(...ts); if (t1 === t0) t1 = t0 + 864e5;
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const padY = (y1 - y0) * 0.15 || 1; y0 -= padY; y1 += padY;
  const X = t => pl + (t - t0) / (t1 - t0) * (W - pl - pr);
  const Y = y => pt + (1 - (y - y0) / (y1 - y0)) * (H - pt - pb);
  const grid = [0, 0.5, 1].map(f => {
    const v = y0 + (y1 - y0) * f, y = Y(v).toFixed(1);
    return `<line class="gd" x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}"/><text x="${pl - 6}" y="${(+y + 3).toFixed(1)}" text-anchor="end">${(fmt || fmtNum)(v)}</text>`;
  }).join('');
  const path = pts.map((p, i) => (i ? 'L' : 'M') + X(p.t).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
  const dots = pts.map(p => `<circle class="dt" cx="${X(p.t).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.5"/>`).join('');
  const dl = t => new Date(t).toLocaleDateString('de-DE', { month: 'short', year: '2-digit' });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf">${grid}<path class="ln" d="${path}"/>${dots}<text x="${pl}" y="${H - 6}">${dl(t0)}</text><text x="${W - pr}" y="${H - 6}" text-anchor="end">${dl(t1)}</text></svg>`;
}

function weekInfo(n) {

  let band = WK_BANDS[0];
  WK_BANDS.forEach(b => { if (years >= b[0]) band = b; });
  const y1 = Math.floor((n * 7 - 1) / 365.25), y0 = Math.floor(((n - 1) * 7 - 1) / 365.25);
  if (y1 > y0 && y1 >= 2) {
    const nb = WK_BANDS.slice().reverse().find(x => y1 >= x[0]) || WK_BANDS[0];
    return { title: `${y1}. Geburtstag`, text: `Alles Gute zum ${y1}. Geburtstag! ${nb[1]}`, hand: false };
  }
  const imp = WK_IMPULSE[(n - 1) % WK_IMPULSE.length];

}

const ab2b64 = buf => { const b = new Uint8Array(buf); let s = ''; const C = 0x8000; for (let i = 0; i < b.length; i += C) s += String.fromCharCode.apply(null, b.subarray(i, i + C)); return btoa(s); };

async function buildBackup(only, opts) {

    if (only && c.id !== only) continue;
    const sfx = kidSfx(c.id);
    const [pr, he, sc] = await Promise.all([kvGet('profile' + sfx), kvGet('health' + sfx), kvGet('school' + sfx)]);

  }

  const photos = [];
  for (const f of (opts && opts.noPhotos ? [] : await photosAll())) { if (only && (f.cid || 'main') !== only) continue; const rec = await pfileGet(f.id); photos.push({ meta: f, b64: rec ? ab2b64(rec.data) : null }); }

  const nm = only ? 'Profil-' + (kidName(CH.find(c => c.id === only)) || 'Kind') : 'MyLuiseApp-Sicherung';

async function importBackup(file, asNew) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { throw new Error('Datei ist keine gültige Sicherung'); }
  if (!data || data.app !== 'luise-identitaet' || !Array.isArray(data.docs)) throw new Error('Datei ist keine gültige Sicherung');
  const kids = Array.isArray(data.children) ? data.children : [{ id: 'main', name: '', profile: data.profile, health: data.health, school: data.school }];
  if (asNew) {
    const map = {};
    const oldId = CH.length === 1 && !S.profile.vorname && !S.docs.length && !S.photos.length && !(S.profile.journey || []).length ? CH[0].id : null;
    const stale = data.family ? CH.filter(c => c.fam && kids.some(k => k.id === c.src)) : [];
    if (stale.length && !confirm('Dieses Profil gibt es hier schon. Mit dem neuen Stand aktualisieren? Eigene Änderungen daran gehen verloren.')) return;
    for (const c of stale) await famRemoveChild(c);
    for (const k of kids) {
      const nid = 'k' + uid(); map[k.id] = nid;
      CH.push(Object.assign({ id: nid, name: (k.profile && k.profile.vorname) || k.name || '' }, data.family ? { fam: 1, src: k.id, famAt: data.family.at } : {}));
      await kvSet('profile@' + nid, k.profile || {}); await kvSet('health@' + nid, k.health || {}); await kvSet('school@' + nid, k.school || {});
    }
    await kvSet('children', CH);
    for (const d of data.docs) {
      const cid = map[(d.meta && d.meta.cid) || 'main']; if (!cid) continue;
      const id = uid(), meta = Object.assign({}, d.meta, { id, cid });
      if (d.b64) await filePut({ id, mime: d.mime, data: b642ab(d.b64) });
      await docPut(meta);
    }
    for (const f of (data.photos || [])) {
      const cid = map[(f.meta && f.meta.cid) || 'main']; if (!cid) continue;
      const id = uid(), meta = Object.assign({}, f.meta, { id, cid });
      if (f.b64) await pfilePut({ id, data: b642ab(f.b64) });
      await photoPut(meta);
    }
    if (oldId) await famRemoveChild({ id: oldId });
    await switchChild(map[kids[0].id]); toast(data.family ? 'Familien-Profil von ' + (data.family.from || 'der Familie') + ' eingespielt' : 'Profil hinzugefügt'); go('home');
    return;
  }
  if (!confirm('Alle aktuellen Daten werden durch die Sicherung ersetzt. Fortfahren?')) return;
  await clearStores();
  CH = kids.map(k => ({ id: k.id, name: (k.profile && k.profile.vorname) || k.name || '' }));
  await kvSet('children', CH);
  for (const k of kids) { const sfx = kidSfx(k.id); await kvSet('profile' + sfx, k.profile || {}); await kvSet('health' + sfx, k.health || {}); await kvSet('school' + sfx, k.school || {}); }
  for (const d of data.docs) {
    if (!d.meta || !d.meta.id) continue;
    if (d.b64) await filePut({ id: d.meta.id, mime: d.mime, data: b642ab(d.b64) });
    await docPut(d.meta);
  }
  for (const f of (data.photos || [])) {
    if (!f.meta || !f.meta.id) continue;
    if (f.b64) await pfilePut({ id: f.meta.id, data: b642ab(f.b64) });
    await photoPut(f.meta);
  }
  const hadSettings = data.settings && typeof data.settings === 'object';
  if (hadSettings) restoreSettings(data.settings);
  await loadState(); render();
  if (hadSettings) { toast('Sicherung eingespielt. Die App startet neu …'); Haptic.fire('success'); setTimeout(() => location.reload(), 1200); }
  else toast('Sicherung eingespielt');
}

const kidName = c => (c.id === CID && S && S.profile.vorname) || c.name || 'Neues Kind';
const kidSfx = id => id === 'main' ? '' : '@' + id;
async function switchChild(id) {
  ls.set('luise_child', id); nowPlaying = null; closeOverlays();
  await loadState(); tab = 'home'; render();
}
function addChild() {
  openSheet({
    title: 'Kind hinzufügen',
    fields: [{ key: 'vorname', label: 'Vorname', required: true, cap: 'words' }, { key: 'geburtsdatum', label: 'Geburtsdatum', type: 'date' }],
    onSave: async v => {
      const id = 'k' + uid();
      CH.push({ id, name: v.vorname }); await kvSet('children', CH);
      await kvSet('profile' + kidSfx(id), { vorname: v.vorname, geburtsdatum: v.geburtsdatum });
      await switchChild(id);
    }
  });
}
async function deleteChild(c) {
  if (CH.length < 2) { toast('Das letzte Profil kann nicht gelöscht werden'); return; }
  if (!confirm(`„${kidName(c)}“ mit allen Dokumenten, Fotos und Videos löschen? Das kann nicht rückgängig gemacht werden.`)) return;
  const sfx = kidSfx(c.id);
  for (const k of ['profile', 'health', 'school']) await tx('kv', 'readwrite', s => s.delete(k + sfx));
  for (const d of await docsAll()) if ((d.cid || 'main') === c.id) { await fileDel(d.id); await docDel(d.id); }
  for (const f of await photosAll()) if ((f.cid || 'main') === c.id) { await pfileDel(f.id); await photoDel(f.id); }
  for (const f of await videosAll()) if ((f.cid || 'main') === c.id) { await vfileDel(f.id); await videoDel(f.id); }
  CH = CH.filter(x => x.id !== c.id); await kvSet('children', CH);
  if (CID === c.id) ls.set('luise_child', CH[0].id);
  await loadState(); render(); toast('Profil gelöscht');
}
async function shareOrDownload(file, title) {
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title }); return true; }
    const u = mkUrl(file), a = h('a', { href: u, download: file.name });
    document.body.append(a); a.click(); a.remove(); setTimeout(() => rmUrl(u), 15000);
    return true;
  } catch (e) { if (!(e && e.name === 'AbortError')) toast('Teilen nicht möglich'); return false; }
}
function viewKids() {

    h('span', { class: 'hubico', html: ICON.kids }), liTxt(kidName(c), (c.id === CID ? 'Dieses Profil ist gerade geöffnet' : 'Tippen zum Wechseln') + (c.fam ? ' · Familien-Ansicht' + (c.famAt ? ', Stand ' + new Date(c.famAt).toLocaleDateString('de-DE') : '') : '')),
    c.id === CID ? h('span', { class: 'chip ok' }, 'aktiv') : chev()))));
  const file = h('input', { type: 'file', accept: '.json,application/json', style: 'display:none', onchange: async e => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    try { await importBackup(f, true); } catch (err) { toast(err.message || 'Fehler beim Importieren'); }
  } });
  wrap.append(h('div', { class: 'card stack' }, h('h2', null, 'Profil teilen'),
    h('p', { class: 'mute' }, 'Exportiere das geöffnete Profil mit Dokumenten und Fotos als Datei, z. B. per AirDrop an deine Partnerin oder deinen Partner. Dort wird es unter „Profil importieren“ als weiteres Profil hinzugefügt. Es gibt keinen Online-Abgleich: Später geänderte Daten müssen erneut geteilt werden.'),
    h('button', { class: 'btn wide', type: 'button', onclick: openFamilyShare }, 'Für Familie teilen (mit Auswahl)'),
    h('button', { class: 'btn ghost wide', onclick: async e => {
      const b = e.currentTarget; b.disabled = true; b.textContent = 'Wird erstellt …';
      try { const f = await buildBackup(CID); b.disabled = false; b.textContent = 'Profil exportieren'; await shareOrDownload(f, 'Profil ' + kidName(CH.find(c => c.id === CID))); }
      catch (err) { b.disabled = false; b.textContent = 'Profil exportieren'; toast('Fehler: ' + (err.message || err)); }

function autoDeadlines() {
  const out = [], p = S.profile, hid = new Set(S.school.hiddenAuto || []), birth = p.geburtsdatum;
  const push = o => { if (!hid.has(o.id)) out.push(o); };
  if (birth) {
    const ld = lifeDays(birth);
    for (const d of U_DEF) {
      if (d[0] === 'U1' || S.health.u[d[0]]) continue;
      const st = uStatus(d, null, birth), from = addDaysIso(birth, d[2]), to = addDaysIso(birth, d[3]);
      const base = { id: 'u:' + d[0], kind: 'U-Heft', title: `${d[0]} Vorsorgeuntersuchung`, tab: 'health', seg: 'uheft', cal: { titel: `${d[0]} Vorsorgeuntersuchung beim Kinderarzt`, datum: to, kategorie: 'Arzt' } };
      if (st === 'due') push(Object.assign(base, { sub: `Zeitfenster ${fmtD(from)} bis ${fmtD(to)}`, date: isoToday(), lvl: 'warn', status: 'jetzt fällig' }));
      else if (st === 'later' && d[2] - ld <= 120) push(Object.assign(base, { sub: `${d[1]} · ab ${fmtD(from)}`, date: from, lvl: 'info', status: rel(from) }));
      else if (st === 'past' && ld - d[3] <= 365) push(Object.assign(base, { sub: `Zeitfenster war bis ${fmtD(to)}. Nachholen oder im U-Heft eintragen.`, date: to, lvl: 'bad', status: 'Fenster vorbei' }));
    }
    if (showImpf()) {
      for (const pl of IMPF_PLAN) {
        const hits = S.health.impfungen.filter(v => pl.rx.test(v.name || ''));
        for (let i = 0; i < pl.slots.length; i++) {
          const [a, b] = pl.slots[i];
          const done = pl.boost ? hits.some(v => v.datum && parseD(v.datum) >= parseD(addDaysIso(birth, a - 120))) : hits.length > i;
          if (done) continue;
          const from = addDaysIso(birth, a), to = addDaysIso(birth, b);
          const st = ld < a ? 'later' : ld <= b ? 'due' : 'past';
          const title = pl.name + (pl.slots.length > 1 && !pl.boost ? ` (${i + 1}. Dosis)` : '');
          const base = { id: `impf:${pl.name}:${i}`, kind: 'Impfung', title, tab: 'health', seg: 'gesundheit', cal: { titel: 'Impfung: ' + title, datum: to, kategorie: 'Arzt' } };

          else if (st === 'later' && a - ld <= 90) push(Object.assign(base, { sub: `Empfohlen ab ${fmtD(from)} (nach STIKO)`, date: from, lvl: 'info', status: rel(from) }));
          else if (st === 'past' && ld - b <= 730) push(Object.assign(base, { sub: `Empfohlenes Fenster endete ${fmtD(to)}. Impfpass prüfen.`, date: to, lvl: 'bad', status: 'prüfen' }));
          break;
        }
      }
      for (const v of S.health.impfungen) if (v.naechste) {
        const n = daysTo(v.naechste);
        if (n <= 60) push({ id: 'impfnext:' + v.id, kind: 'Impfung', title: v.name + ': Auffrischung', sub: 'Fällig am ' + fmtD(v.naechste), date: v.naechste, lvl: n < 0 ? 'bad' : n <= 14 ? 'warn' : 'info', status: rel(v.naechste), tab: 'health', seg: 'gesundheit', cal: { titel: 'Impfung: ' + v.name, datum: v.naechste, kategorie: 'Arzt' } });

    let nb = new Date(n0.getFullYear(), b.getMonth(), b.getDate()); if (nb < n0) nb = new Date(n0.getFullYear() + 1, b.getMonth(), b.getDate());
    const nbIso = isoOf(nb), age = nb.getFullYear() - b.getFullYear();
    if (daysTo(nbIso) <= 60) push({ id: 'bday:' + nb.getFullYear(), kind: 'Geburtstag', title: `${age}. Geburtstag`, sub: wd(nbIso), date: nbIso, lvl: 'info', status: rel(nbIso), tab: 'home', cal: { titel: `${age}. Geburtstag von ${p.vorname || 'Luise'}`, datum: nbIso, kategorie: 'Geburtstag' } });
  }
  for (const m of (p.familie || [])) if (m.geb && !m.gest) {

    if (daysTo(na.iso) <= 30) push({ id: 'fbday:' + m.id + ':' + na.iso.slice(0, 4), kind: 'Geburtstag', title: `${m.name}: ${na.age}. Geburtstag`, sub: wd(na.iso) + ' · ' + m.rolle, date: na.iso, lvl: 'info', status: rel(na.iso), tab: 'family', cal: { titel: `${m.name} hat Geburtstag`, datum: na.iso, kategorie: 'Geburtstag' } });
  }

    const n = daysTo(d.ablauf);
    if (n <= 180) push({ id: 'doc:' + d.id, kind: 'Dokument', title: d.titel + (n < 0 ? ' ist abgelaufen' : ' läuft ab'), sub: 'Gültig bis ' + fmtD(d.ablauf), date: d.ablauf, lvl: n < 0 ? 'bad' : n <= 60 ? 'warn' : 'info', status: n < 0 ? 'abgelaufen' : rel(d.ablauf), tab: 'docs', cal: { titel: d.titel + ' läuft ab', datum: d.ablauf, kategorie: 'Sonstiges' } });

}

    list.replaceChildren(...pages.map((p, i) => h('div', { class: 'scanpg' }, h('img', { src: p.url, alt: 'Seite ' + (i + 1) }), h('small', null, 'Seite ' + (i + 1)),

function famEdges(fam) {

  const parentOfSide = s => s === 'Mutterseite' ? (mut ? mut.id : 'me') : s === 'Vaterseite' ? (vat ? vat.id : 'me') : 'me';
  const gp = s => fam.filter(m => (m.rolle === 'Großmutter' || m.rolle === 'Großvater') && famSide(m) === s);
  const ggp = s => fam.filter(m => /^Urgroß/.test(m.rolle) && famSide(m) === s);
  fam.forEach(m => {
    const r = m.rolle, s = famSide(m);
    if (['Mutter', 'Vater', 'Stiefmutter', 'Stiefvater'].includes(r)) E.push([m.id, 'me']);
    else if (r === 'Schwester' || r === 'Bruder' || r.startsWith('Halb')) [mut, vat].filter(Boolean).forEach(p => E.push([p.id, m.id]));
    else if (r === 'Stiefschwester' || r === 'Stiefbruder') fam.filter(x => x.rolle === 'Stiefmutter' || x.rolle === 'Stiefvater').forEach(p => E.push([p.id, m.id]));
    else if (r === 'Großmutter' || r === 'Großvater') E.push([m.id, parentOfSide(s)]);
    else if (/^Urgroß/.test(r)) { const g = gp(s)[0]; E.push([m.id, g ? g.id : parentOfSide(s)]); }
    else if (r === 'Tante' || r === 'Onkel') gp(s).forEach(g => E.push([g.id, m.id]));
    else if (r === 'Cousine' || r === 'Cousin') { const t = fam.find(x => (x.rolle === 'Tante' || x.rolle === 'Onkel') && famSide(x) === s); if (t) E.push([t.id, m.id]); }
    else if (r === 'Großtante' || r === 'Großonkel') ggp(s).forEach(g => E.push([g.id, m.id]));
  });
  return E;
}

}
